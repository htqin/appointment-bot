name: Test HKID Availability Parser

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Playwright
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium

      - name: Read HKID availability
        run: |
          python - <<'PY'
          import re
          from playwright.sync_api import sync_playwright

          URL = "https://www.gov.hk/tc/apps/bookidcardquota.htm"

          OFFICES = {
              "RHK": "港島辦事處",
              "RKO": "九龍辦事處",
              "RTK": "將軍澳辦事處",
              "FTO": "火炭辦事處",
              "TMO": "屯門辦事處",
              "YLO": "元朗辦事處",
          }

          STATUS_WORDS = [
              "尚有名額",
              "少量名額",
              "已滿",
          ]

          with sync_playwright() as p:
              browser = p.chromium.launch(headless=True)

              page = browser.new_page(
                  viewport={"width": 1440, "height": 1200}
              )

              page.goto(
                  URL,
                  wait_until="networkidle",
                  timeout=90000
              )

              select = page.locator("select").first

              for code, office_name in OFFICES.items():

                  print("")
                  print("=" * 60)
                  print(office_name, code)
                  print("=" * 60)

                  select.select_option(value=code)
                  page.wait_for_timeout(1500)

                  rows = page.locator("tr")

                  found = []

                  for i in range(rows.count()):
                      row = rows.nth(i)

                      try:
                          text = " ".join(
                              row.inner_text().split()
                          )

                          # 有些状态可能写在图片 alt/title 中
                          extra = []

                          for attr in ["alt", "title"]:
                              nodes = row.locator(f"[{attr}]")

                              for j in range(nodes.count()):
                                  value = nodes.nth(j).get_attribute(attr)

                                  if value:
                                      extra.append(value)

                          combined = text + " " + " ".join(extra)

                          date_match = re.search(
                              r"(\d{2}/\d{2})",
                              combined
                          )

                          status = None

                          for word in STATUS_WORDS:
                              if word in combined:
                                  status = word
                                  break

                          if date_match and status:
                              found.append(
                                  (
                                      date_match.group(1),
                                      status
                                  )
                              )

                      except Exception:
                          pass

                  if found:
                      for date, status in found:
                          print(date, "|", status)

                  else:
                      print(
                          "No structured rows found."
                      )

              browser.close()
          PY
