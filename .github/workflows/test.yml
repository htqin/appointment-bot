name: Inspect HKID Date Cells

on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest

    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Playwright
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium

      - name: Inspect date cells
        run: |
          python - <<'PY'
          import re
          from playwright.sync_api import sync_playwright

          URL = "https://www.gov.hk/tc/apps/bookidcardquota.htm"

          with sync_playwright() as p:
              browser = p.chromium.launch(headless=True)

              page = browser.new_page(
                  viewport={"width": 1440, "height": 1200}
              )

              page.goto(
                  URL,
                  wait_until="networkidle",
                  timeout=90000
              )

              # 先固定检查港岛办事处
              select = page.locator("select").first
              select.select_option(value="RHK")
              page.wait_for_timeout(2000)

              print("===== STATUS TEXT SEARCH =====")

              html = page.content()

              for word in [
                  "尚有名額",
                  "少量名額",
                  "已滿",
                  "available",
                  "full",
                  "quota"
              ]:
                  print(
                      word,
                      "=>",
                      word.lower() in html.lower()
                  )

              print("")
              print("===== DATE ELEMENTS =====")

              result = page.evaluate("""
              () => {
                  const dateRegex = /^\\d{2}\\/\\d{2}/;
                  const out = [];

                  const elements = Array.from(
                      document.querySelectorAll("body *")
                  );

                  for (const el of elements) {
                      const ownText =
                          Array.from(el.childNodes)
                          .filter(n => n.nodeType === Node.TEXT_NODE)
                          .map(n => n.textContent.trim())
                          .join(" ")
                          .trim();

                      if (!dateRegex.test(ownText)) {
                          continue;
                      }

                      let current = el;

                      const chain = [];

                      for (let level = 0;
                           level < 5 && current;
                           level++) {

                          chain.push({
                              level: level,
                              tag: current.tagName,
                              id: current.id || "",
                              class:
                                  current.className &&
                                  typeof current.className === "string"
                                  ? current.className
                                  : "",
                              text:
                                  (current.innerText || "")
                                  .replace(/\\s+/g, " ")
                                  .trim()
                                  .slice(0, 300),
                              html:
                                  current.outerHTML
                                  .replace(/\\s+/g, " ")
                                  .slice(0, 1200)
                          });

                          current = current.parentElement;
                      }

                      out.push({
                          date: ownText,
                          chain: chain
                      });

                      if (out.length >= 6) {
                          break;
                      }
                  }

                  return out;
              }
              """)

              for item in result:
                  print("")
                  print("################################")
                  print("DATE:", item["date"])
                  print("################################")

                  for node in item["chain"]:
                      print("")
                      print(
                          "LEVEL",
                          node["level"],
                          "| TAG =", node["tag"],
                          "| ID =", node["id"],
                          "| CLASS =", node["class"]
                      )

                      print("TEXT:")
                      print(node["text"])

                      print("HTML:")
                      print(node["html"])

              print("")
              print("===== POSSIBLE STATUS ELEMENTS =====")

              candidates = page.evaluate("""
              () => {
                  const result = [];

                  const elements = Array.from(
                      document.querySelectorAll(
                          "[class], [style], svg, img"
                      )
                  );

                  for (const el of elements) {
                      const cls =
                          typeof el.className === "string"
                          ? el.className
                          : "";

                      const style =
                          el.getAttribute("style") || "";

                      const aria =
                          el.getAttribute("aria-label") || "";

                      const text =
                          (el.innerText || "")
                          .replace(/\\s+/g, " ")
                          .trim();

                      const combined =
                          (cls + " " +
                           style + " " +
                           aria + " " +
                           text).toLowerCase();

                      if (
                          combined.includes("quota") ||
                          combined.includes("available") ||
                          combined.includes("full") ||
                          combined.includes("status") ||
                          combined.includes("green") ||
                          combined.includes("yellow") ||
                          combined.includes("red")
                      ) {
                          result.push(
                              el.outerHTML
                              .replace(/\\s+/g, " ")
                              .slice(0, 1000)
                          );
                      }

                      if (result.length >= 30) {
                          break;
                      }
                  }

                  return result;
              }
              """)

              for x in candidates:
                  print(x)

              browser.close()
          PY
